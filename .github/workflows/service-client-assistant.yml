name: Service client — Documentation assistant

on:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "ServiceClient/assistant/**"
      - ".github/workflows/service-client-assistant.yml"
  pull_request:
    paths:
      - "ServiceClient/assistant/**"
      - ".github/workflows/service-client-assistant.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ServiceClient/assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install the locked dependencies (incl. pytest)
        run: uv sync --locked

      - name: Unit tests (fake Ollama, no model download)
        run: uv run pytest -q

      - name: Docker image builds (runtime stage)
        run: docker build --target runtime -t maplenou-assistant .
