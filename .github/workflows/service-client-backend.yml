name: Service client — Backend

on:
  push:
    branches: [main, "ci/**"]
    paths: ["ServiceClient/backend/**", ".github/workflows/service-client-backend.yml"]
  pull_request:
    paths: ["ServiceClient/backend/**", ".github/workflows/service-client-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ServiceClient/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + integration tests (*IT) against PostgreSQL 16 started by Testcontainers
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            ServiceClient/backend/target/surefire-reports
            ServiceClient/backend/target/failsafe-reports
