[project]
site_name = "Maplenou — Documentation développeur"
site_description = "Maplenou — Documentation développeur"
docs_dir = "docs"
site_dir = "site"
copyright = "&copy; Maplenou"
extra_css = [
  "assets/maplenou/stylesheets/maplenou.css",
  "assets/maplenou/assistant/assistant.css",
]
extra_javascript = [
  "assets/maplenou/config.js",
  "assets/maplenou/javascripts/language-switch.js",
  "assets/maplenou/assistant/assistant.js",
]
nav = [
  { "Accueil" = "index.md" },
  { "Guide du développeur" = [
    { "Démarrage" = "guide/getting-started.md" },
    { "Visite du dépôt" = "guide/repository.md" },
    { "Architecture" = "guide/architecture.md" },
    { "Backend" = "guide/backend.md" },
    { "Traitements du backend et tests manuels" = "guide/backend-processing.md" },
    { "Tester l'API (Swagger, Postman)" = "guide/api-testing.md" },
    { "Notifications push Firebase" = "guide/firebase.md" },
    { "Intégration à la plateforme Maplenou" = "guide/maplenou-integration.md" },
    { "Frontend" = "guide/frontend.md" },
    { "Sites de documentation" = "guide/documentation.md" },
    { "Assistant de documentation" = "guide/assistant.md" },
    { "Tests" = "guide/testing.md" },
    { "Cache et espace disque" = "guide/caching.md" },
    { "Exploitation" = "guide/operations.md" },
    { "Déploiement (domaines, HTTPS)" = "guide/deployment.md" },
    { "Déploiement sur Render" = "guide/render.md" },
    { "Contribuer" = "guide/contributing.md" },
    { "Agents IA" = "guide/ai-agents.md" },
  ] },
  { "Référentiel du projet (anglais)" = "records.md" },
]

[project.theme]
language = "fr"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.path",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
]

# Light / dark / follow the system (same three choices as the web app)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Passer au thème clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Passer au thème sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Suivre le thème du système"

[project.extra]
# Language selector; language-switch.js keeps the reader on the same page
alternate = [
  { name = "Français", link = "/developer/fr/", lang = "fr" },
  { name = "English", link = "/developer/en/", lang = "en" },
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
