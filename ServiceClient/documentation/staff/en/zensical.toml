[project]
site_name = "Maplenou — Internal support guide"
site_description = "Maplenou — Internal support guide"
docs_dir = "docs"
site_dir = "site"
copyright = "&copy; Maplenou"
extra_css = [
  "assets/maplenou/stylesheets/maplenou.css",
  "assets/maplenou/assistant/assistant.css",
]
extra_javascript = [
  "assets/maplenou/config.js",
  "assets/maplenou/javascripts/language-switch.js",
  "assets/maplenou/assistant/assistant.js",
]
nav = [
  { "Home" = "index.md" },
  { "Roles and access" = "roles-and-access.md" },
  { "Daily work" = "daily-work.md" },
  { "Handle a ticket" = "handle-ticket.md" },
  { "Statuses and transitions" = "statuses-and-transitions.md" },
  { "SLA and calendar" = "sla.md" },
  { "Escalation" = "escalation.md" },
  { "Reopening" = "reopening.md" },
  { "Administration" = "administration.md" },
  { "Reports" = "reports.md" },
  { "Good practices" = "good-practices.md" },
  { "FAQ" = "faq.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.path",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
]

# Light / dark / follow the system (same three choices as the web app)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
# Language selector; language-switch.js keeps the reader on the same page
alternate = [
  { name = "Français", link = "/staff/fr/", lang = "fr" },
  { name = "English", link = "/staff/en/", lang = "en" },
]

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
