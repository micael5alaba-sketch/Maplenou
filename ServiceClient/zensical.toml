# Developer documentation (English) — Zensical project at the repository root so it can use docs/.
# Replaces mkdocs.yml. Build all sites: python documentation/build.py ; preview this one: zensical serve
[project]
site_name = "Maplenou — Developer documentation"
site_description = "Maplenou — Developer documentation"
docs_dir = "docs"
site_dir = "site/developer/en"
copyright = "&copy; Maplenou"
extra_css = [
  "assets/maplenou/stylesheets/maplenou.css",
  "assets/maplenou/assistant/assistant.css",
]
extra_javascript = [
  "assets/maplenou/config.js",
  "assets/maplenou/javascripts/language-switch.js",
  "assets/maplenou/assistant/assistant.js",
]
nav = [
  { "Home" = "index.md" },
  { "Developer guide" = [
    { "Getting started" = "guide/getting-started.md" },
    { "Repository tour" = "guide/repository.md" },
    { "Architecture" = "guide/architecture.md" },
