    { "Wireframes" = "ux-ui/wireframes.md" },
    { "Design System" = "ux-ui/design-system.md" },
    { "Component Inventory" = "ux-ui/component-inventory.md" },
    { "Responsive Design" = "ux-ui/responsive-design.md" },
    { "Mockups and screens" = "ux-ui/screens.md" },
    { "CS-02.1 Journeys" = "ux-ui/CS-02.1-acceptance-criteria.md" },
    { "CS-02.2 Information Architecture" = "ux-ui/CS-02.2-acceptance-criteria.md" },
    { "CS-02.3 Screen Inventory" = "ux-ui/CS-02.3-acceptance-criteria.md" },
    { "CS-02.4 Screen Behavior" = "ux-ui/CS-02.4-acceptance-criteria.md" },
