# Prometheus of the monitoring profile. The bearer token is written from METRICS_TOKEN at start-up
# (docker-compose.yml) because Prometheus does not read environment variables in this file.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: maplenou-support
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["backend:8080"]
