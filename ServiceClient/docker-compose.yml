# Maplenou Customer Service — local stack. Docker is the only requirement (no Java, Node or Python).
#
#   cp .env.example .env                        (Windows: copy .env.example .env) — every value comes from .env
#   docker compose up -d --build --wait                 app http://localhost:3001 (demo login), API :8081
#   docker compose --profile docs up -d --build --wait  + documentation http://localhost:8006 and its assistant
#
# Optional profiles (each one only when you need it — they cost disk and memory):
#   --profile antivirus   ClamAV scans every attachment (ANTIVIRUS=clamav; about 1 GB of RAM, signatures ~300 MB)
#   --profile monitoring  Prometheus (alerts) + Grafana on GRAFANA_HOST_PORT, reading /actuator/prometheus
#   --profile public      Caddy on ports 80/443 with automatic HTTPS for SUPPORT_DOMAIN, HELP_DOMAIN and SITE_DOMAIN
#                         (public deployment: refuses to start unless DOCS_SITES=user and ASSISTANT_SITES=user)
#
# Ollama (the assistant's language model) is chosen in .env with OLLAMA_URL:
#   - Ollama cloud (default): OLLAMA_URL=https://ollama.com + OLLAMA_API_KEY — nothing installed, no model on disk;
#   - Ollama installed on this computer: OLLAMA_URL=http://host.docker.internal:11434;
#   - Ollama in Docker: OLLAMA_URL=http://ollama:11434 and add --profile ollama
#     (docker compose --profile docs --profile ollama up -d --build --wait).
#
# Published ports listen on HOST_BIND_ADDRESS only (127.0.0.1 by default: reachable from this computer, not from
# the network); the public profile's Caddy is the only service open to the Internet (80/443).
#
# Nothing is hard-coded here: ports, credentials, models and limits are variables of .env (documented in
# .env.example). PostgreSQL is not published to the host (no "port 5432 is already allocated");
# docker-compose.override.example.yml publishes it for a SQL client.
#
# Disk usage is bounded: container logs rotate (LOG_MAX_SIZE x LOG_MAX_FILES per container), images are
# multi-stage and slim, Ollama keeps one model in memory. See docs/guide/caching.md and scripts/clean.*.

x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:?Set LOG_MAX_SIZE in .env (copy .env.example)}
    max-file: ${LOG_MAX_FILES:?Set LOG_MAX_FILES in .env}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Set SPRING_PROFILES_ACTIVE in .env}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      ECOSYSTEM_MODE: ${ECOSYSTEM_MODE:?Set ECOSYSTEM_MODE in .env}
      SLA_MODE: ${SLA_MODE:?Set SLA_MODE in .env}
      # Maplenou platform (Bakend) — sign-in with Maplenou accounts, real orders, import of the former tickets
      MAPLENOU_CORE_URL: ${MAPLENOU_CORE_URL:?Set MAPLENOU_CORE_URL in .env}
      MAPLENOU_LOGIN_ENABLED: ${MAPLENOU_LOGIN_ENABLED:?Set MAPLENOU_LOGIN_ENABLED in .env}
      SUPPORT_SERVICE_TOKEN: ${SUPPORT_SERVICE_TOKEN?Set SUPPORT_SERVICE_TOKEN in .env (may be empty)}
      # empty = push notifications are only logged; see docs/guide/firebase.md
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
      REFERENCE_CACHE_TTL: ${REFERENCE_CACHE_TTL:?Set REFERENCE_CACHE_TTL in .env}
      # push to the Maplenou mobile app through Bakend (its FCM tokens) — needs SUPPORT_SERVICE_TOKEN
      MAPLENOU_PUSH_RELAY: ${MAPLENOU_PUSH_RELAY:?Set MAPLENOU_PUSH_RELAY in .env}
      # address of this web app as users see it: pushes link to <SUPPORT_APP_URL>/?ticket=<id>
      SUPPORT_APP_URL: ${SUPPORT_APP_URL:?Set SUPPORT_APP_URL in .env}
      # resolved tickets close by themselves after this ISO-8601 duration (P0D = never)
      SUPPORT_AUTO_CLOSE_AFTER: ${SUPPORT_AUTO_CLOSE_AFTER:?Set SUPPORT_AUTO_CLOSE_AFTER in .env}
      LEGACY_SYNC_ENABLED: ${LEGACY_SYNC_ENABLED:?Set LEGACY_SYNC_ENABLED in .env}
      LEGACY_SYNC_INTERVAL: ${LEGACY_SYNC_INTERVAL:?Set LEGACY_SYNC_INTERVAL in .env}
      # attachments: local (volume below) | cloudinary (authenticated files, CLOUDINARY_URL is a secret)
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:?Set ATTACHMENT_STORAGE in .env}
      CLOUDINARY_URL: ${CLOUDINARY_URL?Set CLOUDINARY_URL in .env (may be empty)}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:?Set CLOUDINARY_FOLDER in .env}
      # antivirus: none | clamav (start the antivirus profile)
      ANTIVIRUS: ${ANTIVIRUS:?Set ANTIVIRUS in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ANTIVIRUS_FAIL_CLOSED: ${ANTIVIRUS_FAIL_CLOSED:?Set ANTIVIRUS_FAIL_CLOSED in .env}
      # requests per minute and per user (429 above)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:?Set RATE_LIMIT_ENABLED in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:?Set RATE_LIMIT_PER_MINUTE in .env}
      RATE_LIMIT_WRITES_PER_MINUTE: ${RATE_LIMIT_WRITES_PER_MINUTE:?Set RATE_LIMIT_WRITES_PER_MINUTE in .env}
      # AI help inside tickets (category/priority suggestion, reply drafts) — needs the docs profile
      AI_ASSIST_ENABLED: ${AI_ASSIST_ENABLED:?Set AI_ASSIST_ENABLED in .env}
      ASSISTANT_INTERNAL_URL: http://assistant:8000
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN?Set ASSISTANT_INTERNAL_TOKEN in .env (may be empty)}
      # Prometheus scrapes /actuator/prometheus with this bearer token; empty = endpoint absent (404)
      METRICS_TOKEN: ${METRICS_TOKEN?Set METRICS_TOKEN in .env (may be empty)}
      # empty = readable text logs | ecs = one JSON object per line (for Loki, Elastic, Datadog…)
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT?Set LOG_FORMAT in .env (may be empty)}
      # native only behind the public profile's Caddy (trusted proxy): real client address for limits and logs
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:?Set FORWARD_HEADERS_STRATEGY in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Bakend on the computer (Linux); Docker Desktop defines it already
    volumes:
      - attachments:/data/attachments
      # secrets/ (git-ignored) holds the Firebase service-account key: read-only, never copied into an image
      - ./secrets:/run/secrets/maplenou:ro
    ports:
      - "${HOST_BIND_ADDRESS:?Set HOST_BIND_ADDRESS in .env}:${BACKEND_HOST_PORT:?Set BACKEND_HOST_PORT in .env}:8080"
    logging: *logging
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      DOCS_BASE_URL: ${DOCS_PUBLIC_URL:?Set DOCS_PUBLIC_URL in .env}
      AUTH_MODE: ${AUTH_MODE:?Set AUTH_MODE in .env}
      # true behind HTTPS (public profile): the session cookie is sent over HTTPS only
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?Set SESSION_COOKIE_SECURE in .env}
      # Firebase web app (browser push). Public values; all empty = push off in the browser.
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_WEB_AUTH_DOMAIN: ${FIREBASE_WEB_AUTH_DOMAIN:-}
      FIREBASE_WEB_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:-}
      FIREBASE_WEB_MESSAGING_SENDER_ID: ${FIREBASE_WEB_MESSAGING_SENDER_ID:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
    ports:
      - "${HOST_BIND_ADDRESS}:${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in .env}:3000"
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ documentation profile
  docs:
    profiles: ["docs"]
    build:
      context: .
      dockerfile: documentation/Dockerfile
      args:
        # Public deployments: DOCS_SITES=user (staff and developer guides are internal)
        DOCS_SITES: ${DOCS_SITES:?Set DOCS_SITES in .env}
    ports:
      - "${HOST_BIND_ADDRESS}:${DOCS_HOST_PORT:?Set DOCS_HOST_PORT in .env}:80"
    logging: *logging
    restart: unless-stopped

  assistant:
    profiles: ["docs"]
    build: ./assistant
    # no depends_on: Ollama may run on the computer (not in Compose); the assistant waits for it and answers
    # with search results only while it is unreachable
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop (Windows, macOS) defines it already
    environment:
      # indexes are read from the docs server: the sites are built only once (docs image)
      ASSISTANT_INDEX_URL: http://docs
      OLLAMA_URL: ${OLLAMA_URL:?Set OLLAMA_URL in .env}
      # Ollama cloud key (secret, server-side only); empty for a local Ollama
      OLLAMA_API_KEY: ${OLLAMA_API_KEY?Set OLLAMA_API_KEY in .env (empty for a local Ollama)}
      # downloads the missing models into a local Ollama on first start (ignored with Ollama cloud)
      ASSISTANT_PULL_MODELS: ${ASSISTANT_PULL_MODELS:?Set ASSISTANT_PULL_MODELS in .env}
      ASSISTANT_CHAT_MODEL: ${ASSISTANT_CHAT_MODEL:?Set ASSISTANT_CHAT_MODEL in .env}
      # empty = no embeddings (lexical search only), the usual choice with Ollama cloud
      ASSISTANT_EMBED_MODEL: ${ASSISTANT_EMBED_MODEL?Set ASSISTANT_EMBED_MODEL in .env (may be empty)}
      ASSISTANT_THINK: ${ASSISTANT_THINK?Set ASSISTANT_THINK in .env (may be empty)}
      ASSISTANT_SITES: ${ASSISTANT_SITES:?Set ASSISTANT_SITES in .env}
      ASSISTANT_PUBLIC_BASE_URL: ${DOCS_PUBLIC_URL}
      # the docs site and the web app (help-centre search of the app calls /api/assistant/search)
      ASSISTANT_ALLOWED_ORIGINS: ${DOCS_PUBLIC_URL},${CORS_ALLOWED_ORIGINS}
      # shared with the backend for /api/assistant/internal/* (AI help in tickets); empty = disabled
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN?Set ASSISTANT_INTERNAL_TOKEN in .env (may be empty)}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:?Set ASSISTANT_RATE_LIMIT in .env}
      ASSISTANT_ANSWER_CACHE_SIZE: ${ASSISTANT_ANSWER_CACHE_SIZE:?Set ASSISTANT_ANSWER_CACHE_SIZE in .env}
      ASSISTANT_ANSWER_CACHE_TTL: ${ASSISTANT_ANSWER_CACHE_TTL:?Set ASSISTANT_ANSWER_CACHE_TTL in .env}
    volumes:
      - assistant-cache:/var/cache/assistant   # embeddings, computed once per documentation version
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ antivirus profile
  clamav:
    profiles: ["antivirus"]
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE in .env}
    volumes:
      - clamav:/var/lib/clamav   # virus signatures, updated by freshclam inside the container
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s   # the first signature download takes a few minutes
      retries: 5
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ monitoring profile
  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE in .env}
    # the scrape token goes to a file (Prometheus does not expand environment variables in its configuration)
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$METRICS_TOKEN\" ] || { echo 'Set METRICS_TOKEN in .env for the monitoring profile' >&2; exit 1; }; printf %s \"$$METRICS_TOKEN\" > /tmp/metrics-token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=$$PROMETHEUS_RETENTION --storage.tsdb.retention.size=1GB"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN?Set METRICS_TOKEN in .env}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:?Set PROMETHEUS_RETENTION in .env}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    logging: *logging
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE in .env}
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    ports:
      - "${HOST_BIND_ADDRESS}:${GRAFANA_HOST_PORT:?Set GRAFANA_HOST_PORT in .env}:3000"
    logging: *logging
    restart: unless-stopped

  # ------------------------------------------------------------------ public profile (deployment on a server)
  # Caddy obtains and renews Let's Encrypt certificates for the three domains (DNS must point to this server,
  # ports 80 and 443 open). Only the web app, the user guide + assistant and the public site are reachable: the
  # API, the database, staff/developer docs and /api/assistant/internal/ stay inside the Docker network.
  caddy:
    profiles: ["public"]
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE in .env}
    depends_on: [frontend, docs, site]
    environment:
      SUPPORT_DOMAIN: ${SUPPORT_DOMAIN:?Set SUPPORT_DOMAIN in .env}
      HELP_DOMAIN: ${HELP_DOMAIN:?Set HELP_DOMAIN in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      DOCS_SITES: ${DOCS_SITES}
      ASSISTANT_SITES: ${ASSISTANT_SITES}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      AUTH_MODE: ${AUTH_MODE}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
    # refuses to publish internal documentation or the demo profile
    entrypoint: ["/bin/sh", "/etc/caddy/guard.sh"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/guard.sh:/etc/caddy/guard.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    logging: *logging
    restart: unless-stopped

  # the public website (../Site_vitrine), served by Caddy on SITE_DOMAIN
  site:
    profiles: ["public"]
    build: ../Site_vitrine
    environment:
      MAPLENOU_API_URL: ${MAPLENOU_CORE_URL}
      APP_URL: ${MAPLENOU_APP_URL?Set MAPLENOU_APP_URL in .env (may be empty)}
      ANDROID_APP_URL: ${ANDROID_APP_URL?Set ANDROID_APP_URL in .env (may be empty)}
      IOS_APP_URL: ${IOS_APP_URL?Set IOS_APP_URL in .env (may be empty)}
      SERVICE_CLIENT_URL: https://${SUPPORT_DOMAIN}
      HELP_CENTER_URL: https://${HELP_DOMAIN}/user/fr/
      SITE_PUBLIC_URL: https://${SITE_DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *logging
    restart: unless-stopped

  # Only with --profile ollama (and OLLAMA_URL=http://ollama:11434): skip it when Ollama runs on the computer.
  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE in .env}
    environment:
      # unload idle models and keep at most one in memory (RAM), one request at a time (CPU)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:?Set OLLAMA_KEEP_ALIVE in .env}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging
    restart: unless-stopped
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA container toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  pgdata:
  attachments:
  ollama:
  assistant-cache:
  clamav:
  prometheus:
  grafana:
  caddy-data:
  caddy-config:
