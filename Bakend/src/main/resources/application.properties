# Nom de l'application (apparait dans les logs au demarrage, ex: "Starting MaplenouApplication").
spring.application.name=Maplenou

# -- Base de donnees PostgreSQL ----------------------------------------------
# URL de connexion JDBC. ${DB_URL:...} veut dire : "utilise la variable d'environnement DB_URL si
# elle existe, sinon utilise la valeur de secours apres les deux-points (utile en local)".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/maplenou_db}
# Nom d'utilisateur PostgreSQL.
spring.datasource.username=${DB_USERNAME:postgres}
# Mot de passe PostgreSQL. En production, TOUJOURS le fournir via la variable DB_PASSWORD --
# ne jamais garder la valeur de secours (uniquement destinee au poste de developpement local).
spring.datasource.password=${DB_PASSWORD:Micael2005@}
# Pilote JDBC PostgreSQL (fait le lien technique entre Java et la base de donnees).
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions HikariCP : reserve a l'avance un lot de connexions ouvertes vers la base
# pour eviter de payer le cout d'ouverture d'une connexion a chaque requete.
# Nombre maximum de connexions ouvertes simultanement vers la base (a augmenter avant une montee
# en charge si les requetes commencent a attendre une connexion libre).
spring.datasource.hikari.maximum-pool-size=10
# Nombre minimum de connexions gardees ouvertes meme quand l'application est peu sollicitee.
spring.datasource.hikari.minimum-idle=2
# Delai maximum (en millisecondes) d'attente d'une connexion libre avant d'echouer (30 secondes ici).
spring.datasource.hikari.connection-timeout=30000

# -- JPA / Hibernate ----------------------------------------------------------
# IMPORTANT : le schema de base de donnees vit UNIQUEMENT dans les fichiers de migration Flyway
# (src/main/resources/db/migration/). "validate" veut dire qu'Hibernate verifie seulement que le
# schema correspond aux entites Java, sans jamais le modifier lui-meme.
# Ne JAMAIS passer a "update" ou "create" -- cela court-circuiterait Flyway et risquerait de
# desynchroniser le schema reel de l'historique des migrations versionnees.
spring.jpa.hibernate.ddl-auto=validate
# Desactive le pattern "Open Session In View" : la session Hibernate se ferme des la fin de la
# transaction, pas a la fin de la requete HTTP. Oblige a charger toutes les donnees necessaires
# explicitement dans les services (evite des requetes SQL cachees et couteuses cote vue).
spring.jpa.open-in-view=false
# Quand une collection liee (ex: les images d'une liste de produits) est chargee en differe
# ("lazy"), Hibernate regroupe les identifiants par lots de 20 et fait une seule requete
# "WHERE id IN (...)" au lieu d'une requete separee par element (evite le probleme "N+1 requetes").
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# -- Flyway (migrations de base de donnees) ----------------------------------
# L'auto-configuration Flyway de Spring Boot est desactivee ici : Flyway est declenche a la main
# dans FlywayConfig.java pour garantir qu'il migre le schema AVANT qu'Hibernate ne le verifie
# (necessaire avec cette version de Spring Boot 4.x, sinon l'ordre de demarrage n'est pas garanti).
spring.flyway.enabled=false

# -- JWT (jetons d'authentification) -----------------------------------------
# Cle secrete utilisee pour signer les jetons JWT (doit faire au moins 256 bits / 32 caracteres,
# sinon l'application refuse de demarrer). En production, generer une valeur aleatoire et la
# stocker dans un gestionnaire de secrets (AWS Secrets Manager, Vault...) via la variable JWT_SECRET
# -- ne jamais garder la valeur de secours ci-dessous en production.
app.jwt.secret=${JWT_SECRET:83b92a5e419f406843fbff059c96087bec2aa0315afd20adaff225e061287dba}
# Duree de vie du jeton d'acces (access token) en millisecondes : 900000 ms = 15 minutes.
# C'est le jeton utilise pour chaque appel API ; sa courte duree limite les degats en cas de vol.
app.jwt.access-token-expiration-ms=900000
# Duree de vie du jeton de rafraichissement (refresh token) en millisecondes :
# 604800000 ms = 7 jours. Sert uniquement a obtenir un nouveau jeton d'acces sans se reconnecter.
app.jwt.refresh-token-expiration-ms=604800000

# -- Redis (cache + securite) -------------------------------------------------
# Redis est INDISPENSABLE au fonctionnement de l'authentification : liste noire des jetons
# revoques, limitation du nombre de requetes (rate limiting), verrouillage de compte apres
# plusieurs echecs de connexion, et cache des categories/zones de livraison.
# En production, definir REDIS_HOST/REDIS_PORT/REDIS_PASSWORD vers l'instance managee choisie
# (Upstash, Redis Cloud, AWS ElastiCache...) et REDIS_SSL_ENABLED=true si elle exige une connexion
# chiffree (cas le plus courant pour les offres cloud).
# Adresse du serveur Redis.
spring.data.redis.host=${REDIS_HOST:localhost}
# Port du serveur Redis (6379 est le port par defaut de Redis).
spring.data.redis.port=${REDIS_PORT:6379}
# Mot de passe Redis (vide en local ; a renseigner en production si l'instance en exige un).
spring.data.redis.password=${REDIS_PASSWORD:}
# Active la connexion chiffree (TLS) a Redis -- a mettre a "true" en production si l'hebergeur
# Redis l'exige (c'est le cas de la plupart des offres managees).
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
# Numero de la base logique Redis a utiliser (Redis permet plusieurs bases numerotees, 0 par defaut).
spring.data.redis.database=0
# Delai maximum d'attente d'une reponse de Redis avant d'abandonner (2 secondes).
spring.data.redis.timeout=2000ms
# Pool de connexions Redis (bibliotheque Lettuce) : nombre maximum de connexions actives simultanees.
spring.data.redis.lettuce.pool.max-active=8
# Nombre maximum de connexions gardees ouvertes mais inactives (pretes a etre reutilisees).
spring.data.redis.lettuce.pool.max-idle=8
# Nombre minimum de connexions toujours maintenues ouvertes, meme sans activite.
spring.data.redis.lettuce.pool.min-idle=1

# -- CORS (autorisation des sites web a appeler cette API) -------------------
# Liste des origines (domaines) autorisees a appeler l'API depuis un navigateur : l'app Flutter
# en version web et le back-office Next.js. En local, ce sont les ports de developpement habituels.
# En production, remplacer par les vrais domaines via CORS_ALLOWED_ORIGINS=https://mondomaine.com
# (plusieurs domaines separes par des virgules si besoin).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4000}

# -- Limitation du nombre de requetes (rate limiting) sur l'authentification -
# Nombre maximum de tentatives de connexion/inscription autorisees par minute et par adresse IP,
# sur les routes /api/auth/**. Protege contre les attaques par force brute. Modifiable via la
# variable AUTH_RATE_LIMIT_PER_MINUTE (utile pour l'augmenter temporairement pendant des tests).
app.rate-limit.auth.max-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}

# -- Proxy de confiance (pour un rate limiting fiable derriere un reverse proxy) -
# Liste des adresses IP des reverse proxies autorises a transmettre l'en-tete "X-Forwarded-For"
# (qui indique la vraie IP du visiteur). Sans cette liste, n'importe quel client pourrait falsifier
# son IP dans cet en-tete pour contourner la limitation de requetes.
# Laisser vide en developpement local (pas de proxy). En production derriere un load balancer ou
# un reverse proxy (nginx, Cloudflare...), renseigner ses IP, ex: app.trusted-proxy-ips=10.0.0.1,10.0.0.2
app.trusted-proxy-ips=

# -- Webhook de paiement ------------------------------------------------------
# Secret partage, envoye dans l'en-tete "X-Webhook-Secret", que la passerelle de paiement doit
# fournir pour prouver que l'appel au webhook vient bien d'elle et pas d'un tiers malveillant.
# En production, generer une valeur aleatoire forte et la stocker dans un gestionnaire de secrets.
# TODO (prochaine etape) : remplacer ce secret partage simple par une vraie verification de
# signature HMAC-SHA256 propre a FedaPay, une fois l'integration FedaPay realisee.
app.webhook.secret=${WEBHOOK_SECRET:maplenou-webhook-dev-secret-change-in-production}

# -- Firebase (notifications push) -------------------------------------------
# Chemin vers le fichier JSON du compte de service Firebase, telecharge depuis la console Firebase
# du projet. "classpath:" veut dire que le fichier est embarque dans l'application (voir
# src/main/resources/firebase-service-account.json). En production, preferer stocker le contenu
# de ce fichier dans une variable d'environnement ou un gestionnaire de secrets plutot que de
# l'embarquer tel quel. Avec Docker, FIREBASE_SERVICE_ACCOUNT_PATH=file:/app/firebase-service-account.json
# pointe vers le fichier monte en volume depuis la machine hote (voir docker-compose.yml).
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
# URL de la base de donnees temps reel Firebase associee au projet (format standard Firebase :
# https://<identifiant-du-projet>-default-rtdb.<region>.firebasedatabase.app).
app.firebase.database-url=https://maplenou-c21c2-default-rtdb.europe-west1.firebasedatabase.app

# -- Cloudinary (stockage des images/medias) ---------------------------------
# Identifiants du compte Cloudinary, au format cloudinary://<cle_api>:<secret_api>@<nom_du_cloud>.
# Le backend ne recoit jamais les fichiers directement : il genere juste une signature qui permet
# au client (app Flutter, back-office) d'envoyer l'image directement a Cloudinary.
# La valeur de secours ci-dessous est un placeholder qui ne fonctionne pas (compte factice) :
# tant qu'elle n'est pas remplacee, l'upload de medias repond volontairement une erreur claire
# plutot qu'une fausse reussite. En production, definir CLOUDINARY_URL avec les vraies cles.
app.cloudinary.url=${CLOUDINARY_URL:cloudinary://dev-key:dev-secret@dev-cloud}

# -- Transporteur tiers (Colissimo) -------------------------------------------
# Integration du transporteur pour le transport principal (en plus des livreurs internes geres
# par le module "delivery"). Desactivee par defaut : necessite un vrai contrat Colissimo Entreprise
# et les identifiants de son webservice avant de pouvoir etre activee.
# Active ou non l'appel reel au webservice Colissimo (false = renvoie une erreur claire "non configure").
app.carrier.colissimo.enabled=${COLISSIMO_ENABLED:false}
# Numero de contrat Colissimo Entreprise (fourni par La Poste lors de la signature du contrat).
app.carrier.colissimo.contract-number=${COLISSIMO_CONTRACT_NUMBER:}
# Cle d'API du webservice Colissimo (fournie avec le contrat).
app.carrier.colissimo.api-key=${COLISSIMO_API_KEY:}

# -- Swagger / OpenAPI (documentation interactive de l'API) ------------------
# Adresse a laquelle consulter la documentation interactive dans un navigateur
# (ex: http://localhost:8080/swagger-ui.html).
springdoc.swagger-ui.path=/swagger-ui.html
# Adresse a laquelle recuperer la description technique brute de l'API au format OpenAPI/JSON.
springdoc.api-docs.path=/v3/api-docs
# Active ou desactive la generation de la documentation brute (JSON). En production, passer
# SWAGGER_ENABLED=false pour ne pas exposer publiquement le detail de tous les endpoints de l'API.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
# Active ou desactive la page web interactive Swagger UI (meme logique que ci-dessus).
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
