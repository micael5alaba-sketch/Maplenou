services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: maplenou_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maplenou_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Le vrai fichier doit exister sur la machine hôte (jamais dans Git, voir MANUEL.md §4) --
      # ce montage le rend visible dans le conteneur à l'emplacement lu par FirebaseConfig.
      FIREBASE_SERVICE_ACCOUNT_PATH: file:/app/firebase-service-account.json
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
